{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listenarr.fullname" . }}
  labels:
    {{- include "listenarr.labels" . | nindent 4 }}
spec:
  # Single replica: the embedded SQLite database is not shareable
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "listenarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "listenarr.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "listenarr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "listenarr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ASPNETCORE_URLS
              value: {{ printf "http://*:%v" .Values.service.port | quote }}
          {{- range .Values.env }}
            - name: {{ .name | quote }}
              {{- if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- range . }}
            {{- if eq .type "secret" }}
            - secretRef:
                name: {{ .name | quote }}
            {{- end }}
            {{- if eq .type "configmap" }}
            - configMapRef:
                name: {{ .name | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          {{- if .Values.persistence.enabled }}
            - name: config
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- if .Values.library.enabled }}
            - name: library
              mountPath: {{ .Values.library.mountPath }}
              {{- with .Values.library.subPath }}
              subPath: {{ . }}
              {{- end }}
          {{- end }}
          {{- if .Values.downloads.enabled }}
            - name: downloads
              mountPath: {{ .Values.downloads.mountPath }}
              {{- with .Values.downloads.subPath }}
              subPath: {{ . }}
              {{- end }}
          {{- end }}
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
      {{- if .Values.persistence.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-config" (include "listenarr.fullname" .)) }}
      {{- end }}
      {{- if .Values.library.enabled }}
        - name: library
          persistentVolumeClaim:
            claimName: {{ required "library.existingClaim is required when library.enabled is true" .Values.library.existingClaim }}
      {{- end }}
      {{- if .Values.downloads.enabled }}
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ required "downloads.existingClaim is required when downloads.enabled is true" .Values.downloads.existingClaim }}
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
